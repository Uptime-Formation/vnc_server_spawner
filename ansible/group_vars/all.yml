base_user_password: devops101
allow_passwd_ssh_connection: "yes"
ssh_public_key: ~

ansible_user: root


## Which environment to setup
formation_ansible: yes
docker_state: present


# K8S config
local_kubeconfig_path: ~/.kube/guac3s.kubeconfig

# Helm chart_version pins below: these WILL go stale (repos prune old
# chart releases from their index, and installs then fail with
# "failed to download ... at version X"). Pin exact tested versions
# (don't use "latest"/semver ranges -- kubernetes.core.helm's
# chart_version doesn't support ranges anyway, and an untested major
# jump landing silently mid-bootstrap is worse than a loud failure).
# Each pin below is dated to when it was last verified against the
# chart repo. To check for drift before it breaks a run:
#   curl -s <repo_url>/index.yaml | grep -A2 'name: <chart>' | grep version
cilium_chart_version: 1.13.0

# verified 2026-09-19 against https://kubernetes.github.io/ingress-nginx/index.yaml
ingress_nginx_chart_version: 4.15.1

ingress_nginx_chart_values:
  # @alban: dropped "replicats: 2" on 2026-09-19, a typo for
  # controller.replicaCount that Helm silently ignored (unknown key) --
  # never actually set 2 replicas. Chart default (1) is fine.
  controller:
    # @alban: added 2026-09-19. Without controller.extraArgs set at all,
    # the chart's controller-role.yaml template does
    # `ne (index .Values.controller.extraArgs "update-status") "false"`,
    # which errors with "incompatible types for comparison" when
    # extraArgs isn't present in the values kubernetes.core.helm passes
    # through. Explicit {} matches the chart's own documented default
    # and keeps `index` returning "" instead of nil. Known chart gotcha,
    # see https://github.com/kubernetes/ingress-nginx/issues/10833.
    extraArgs: {}
    service:
      labels:
        svccontroller.k3s.cattle.io/lbpool: server

# verified 2026-09-19 against https://charts.jetstack.io/index.yaml
certmanager_chart_version: 1.21.2

certmanager_chart_values:
  installCRDs: true

argocd_chart_version: 5.19.7 # argocd chart values: see role template

postgresql_chart_version: 12.2.0

guacamole_chart_version: 1.4.0