- hosts: k3s_cluster
  become: yes
  roles:
    - name: xanmanning.k3s
      tags:
       - k3s_cluster
      vars:
        k3s_registration_address: "{{ hostvars[groups['k3s_server'][0]].ansible_host }}"
        k3s_release_version: "v1.36.4+k3s1"
        # @alban: added 2026-09-19. The role's memory-cgroup pre-check
        # (pre_checks_cgroups.yml) greps /proc/cgroups for a "memory"
        # line reporting enabled -- that's cgroup v1 subsystem
        # accounting, which is absent by design on a cgroup-v2-only
        # host even though memory accounting works fine there (verified
        # "memory" is listed in /sys/fs/cgroup/cgroup.controllers on
        # guacamole-server). False positive, not a real missing
        # kernel feature. Dropping "memory" here (role param, outranks
        # the role's own vars/main.yml) keeps the cpuset check and
        # every other env pre-check intact, rather than disabling all
        # of them via k3s_skip_env_checks.
        k3s_cgroup_subsys:
          - name: cpuset
            documentation: |
              If you are running Alpine Linux, see:
              https://rancher.com/docs/k3s/latest/en/advanced/#additional-preparation-for-alpine-linux-setup

- hosts: localhost
  tasks:
    - name: Slurp k3s_kubeconfig
      slurp:
        src: /etc/rancher/k3s/k3s.yaml
      delegate_to: "{{ groups['k3s_server'][0] }}"
      no_log: true
      tags:
       - k3s_cluster
      register: k3s_kubeconfig
      until: " k3s_kubeconfig is not failed"
      retries: 10
      delay: 10

    - name: write k3s kubeconfig locally
      copy:
        content: "{{ k3s_kubeconfig['content'] | b64decode | replace('127.0.0.1', hostvars[groups['k3s_server'][0]].ansible_host) }}"
        dest: ~/.kube/guac3s.{{ hostvars[groups['guacamole_infra'][0]].infra_subdomain }}.kubeconfig
      no_log: true
      tags:
       - k3s_cluster
      register: edit_k3s_config
      until: " edit_k3s_config is not failed"
      retries: 10
      delay: 10
