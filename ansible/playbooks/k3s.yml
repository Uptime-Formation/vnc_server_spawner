- hosts: k3s_cluster
  become: yes
  roles:
    - name: xanmanning.k3s
      tags:
       - k3s_cluster
      vars:
        k3s_registration_address: "{{ hostvars[groups['k3s_server'][0]].ansible_host }}"
        k3s_release_version: "v1.36.4+k3s1"
        # @alban: added 2026-09-19. The role's cgroup pre-checks
        # (pre_checks_cgroups.yml) grep /proc/cgroups for each
        # subsystem's v1-style enabled line -- guacamole-server is
        # cgroup-v2-only, so /proc/cgroups never reports memory OR
        # cpuset as enabled there (both were tried and both false-
        # positive-failed), even though both are genuinely present in
        # /sys/fs/cgroup/cgroup.controllers. The check method itself
        # doesn't apply to a v2-only kernel. Empty list (role param,
        # outranks the role's own vars/main.yml) skips the whole
        # cgroup pre-check loop, while every other env pre-check
        # (Ansible/Python/init-system/openrc/packages) stays intact --
        # narrower than k3s_skip_env_checks, which would disable those
        # too.
        k3s_cgroup_subsys: []

- hosts: localhost
  tasks:
    - name: Slurp k3s_kubeconfig
      slurp:
        src: /etc/rancher/k3s/k3s.yaml
      delegate_to: "{{ groups['k3s_server'][0] }}"
      no_log: true
      tags:
       - k3s_cluster
      register: k3s_kubeconfig
      until: " k3s_kubeconfig is not failed"
      retries: 10
      delay: 10

    - name: write k3s kubeconfig locally
      copy:
        content: "{{ k3s_kubeconfig['content'] | b64decode | replace('127.0.0.1', hostvars[groups['k3s_server'][0]].ansible_host) }}"
        dest: ~/.kube/guac3s.{{ hostvars[groups['guacamole_infra'][0]].infra_subdomain }}.kubeconfig
      no_log: true
      tags:
       - k3s_cluster
      register: edit_k3s_config
      until: " edit_k3s_config is not failed"
      retries: 10
      delay: 10
